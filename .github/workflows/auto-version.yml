name: Auto Version Bump

on:
  push:
    branches: [ main ]

jobs:
  auto-version:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Check if should skip
      id: should_skip
      env:
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        if [[ "$COMMIT_MESSAGE" == *"chore: release v"* ]]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "Skipping - this is already a release commit"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Proceeding with version bump"
        fi
        
    - name: Use Node.js 20.x
      if: steps.should_skip.outputs.skip == 'false'
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Configure Git
      if: steps.should_skip.outputs.skip == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
    - name: Install dependencies
      if: steps.should_skip.outputs.skip == 'false'
      run: npm ci
      
    - name: Run tests
      if: steps.should_skip.outputs.skip == 'false'
      run: npm test
      
    - name: Bump minor version and push tag
      if: steps.should_skip.outputs.skip == 'false'
      run: npm version minor
      # `npm version minor` bumps the version in package.json, commits, and
      # creates a git tag. Pushing the tag triggers release.yml for the
      # OIDC-based npm publish.
      
    - name: Summary
      if: steps.should_skip.outputs.skip == 'false'
      run: |
        NEW_VERSION="v$(node -p "require('./package.json').version")"
        echo "✅ Auto-bumped version to $NEW_VERSION"
        echo "✅ Git tag $NEW_VERSION pushed → triggers release.yml for npm publish"
